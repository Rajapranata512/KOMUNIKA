name: aksara-journal-platform
services:
  postgres:
    image: postgres:18-alpine
    environment:
      { POSTGRES_DB: aksara, POSTGRES_USER: aksara, POSTGRES_PASSWORD: aksara_local_only }
    ports: ['5432:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      {
        test: ['CMD-SHELL', 'pg_isready -U aksara -d aksara'],
        interval: 5s,
        timeout: 5s,
        retries: 10,
      }
  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: [redis_data:/data]
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 5s, timeout: 5s, retries: 10 }
  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment: { MINIO_ROOT_USER: aksara_local, MINIO_ROOT_PASSWORD: aksara_local_password_only }
    ports: ['9000:9000', '9001:9001']
    volumes: [minio_data:/data]
  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']
volumes: { postgres_data: {}, redis_data: {}, minio_data: {} }
