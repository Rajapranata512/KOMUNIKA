name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.8.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:validate
      - run: pnpm build
  integration:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      APP_BASE_URL: http://localhost:3100
      API_BASE_URL: http://127.0.0.1:3101/api/v1
      DATABASE_URL: postgresql://aksara:aksara_local_only@localhost:5432/aksara
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-only-not-for-production
      CSRF_SECRET: ci-csrf-secret-only-not-for-production
      MFA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      OBJECT_STORAGE_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_BUCKET_PRIVATE: aksara-private
      OBJECT_STORAGE_BUCKET_PUBLIC: aksara-public
      OBJECT_STORAGE_ACCESS_KEY: aksara_local
      OBJECT_STORAGE_SECRET_KEY: aksara_local_password_only
      ANTIVIRUS_HOST: localhost
      ANTIVIRUS_PORT: 3310
      FILE_SCAN_MODE: disabled
      EMAIL_DELIVERY_MODE: development-token
      PUBLICATION_SCHEDULER_MODE: disabled
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.8.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: touch .env
      - name: Start healthy integration services
        run: docker compose -f infra/docker/compose.yml up -d --wait --wait-timeout 240 postgres redis object-storage mailpit clamav
      - name: Bootstrap object-storage buckets
        run: docker compose -f infra/docker/compose.yml run --rm object-storage-init
      - run: pnpm --filter @aksara/database exec prisma migrate deploy --schema prisma/schema.prisma
      - run: pnpm test:integration
      - run: pnpm test:e2e
      - run: pnpm test:a11y
      - if: always()
        run: docker compose -f infra/docker/compose.yml logs --no-color --tail=100
      - if: always()
        run: docker compose -f infra/docker/compose.yml down -v
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan repository dependencies, secrets, and configuration
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
  container-security:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - postgres:18-alpine
          - redis:8-alpine
          - chrislusf/seaweedfs:4.29
          - axllent/mailpit:latest
          - clamav/clamav:stable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Scan local-service image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          trivy-config: .trivy.yaml
          exit-code: '1'
